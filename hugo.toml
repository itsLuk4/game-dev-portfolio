baseURL = "https://itsluk4.github.io/game-dev-portfolio/"
locale = "en-US"
title = "Portfolio"
theme = "loficode"

enableEmoji = true

[outputs]
  home = ["HTML", "JSON"]
  page = ["HTML"]
  section = ["HTML", "JSON"]
  taxonomy = ["HTML", "JSON"]

[outputFormats]
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true
  [outputFormats.pages]
    mediaType = "application/json"
    baseName = "pages"
    isPlainText = true

[pagination]
  pagerSize = 10
  path = "page"

[params]
  description = "Portfolio of a Game Developer & Designer"
  tagline = "Creating player experience and emotion"

[params.ambient_sounds]
  persist = true
  default_volume = 0.4

[params.author]
  name = "Luka Živko"
  image = "images/profile.png"

[params.social]
  github = "https://github.com/itsLuk4"
  linkedin = "https://www.linkedin.com/in/itsluk4-dev92"
  email = "luka.zivko9@gmail.com"
  steam = "https://steamcommunity.com/id/clawless92/"

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 10

[[menu.main]]
  name = "Game Design Documents"
  url = "/categories/design-docs/"
  weight = 20

[[menu.main]]
  name = "Game Projects"
  url = "/categories/games/"
  weight = 30

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 40

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = true
    lineNumbersInTable = false
    tabWidth = 2
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"
  platform = "platforms"
  engine = "engines"
  genre = "genres"