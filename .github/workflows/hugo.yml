name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]          # runs on every push to main
  workflow_dispatch:          # also run manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # needed because the theme is a submodule

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.169.0'       # match the version you use locally
          extended: true                # needed for SCSS / PostCSS

      - name: Build
        run: hugo --minify               # outputs to ./public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
