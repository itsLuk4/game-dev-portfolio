<div class="ambient-bar">
    <div class="ambient-controls">
        <button class="mute-toggle muted" title="Toggle ambient sounds" aria-label="Toggle ambient sounds">
            <span class="icon-glyph" aria-hidden="true">🔇</span>
        </button>
        <button class="ambient-icon" data-sound="coffee" title="Coffee Shop Ambience — Calm, cozy background" aria-label="Coffee shop ambience (calm)">
            <span class="icon-glyph" aria-hidden="true">☕</span>
        </button>
        <button class="ambient-icon" data-sound="chiptune" title="Chiptune Music — Lively, energetic 8-bit vibes" aria-label="Chiptune music (lively)">
            <span class="icon-glyph" aria-hidden="true">🎮</span>
        </button>
    </div>

    <div class="ambient-label">
        <span class="ambient-text" aria-live="polite">🎵 Click ☕ for calm ambience or 🎮 for lively chiptune</span>
    </div>

    <div class="volume-container">
        <input type="range" class="volume-slider" min="0" max="1" step="0.1" value="{{ .Site.Params.ambient_sounds.default_volume }}" aria-label="Ambient sound volume">
        <div class="equalizer muted" aria-hidden="true">
            {{ range (seq 8) }}
            <div class="equalizer-bar"></div>
            {{ end }}
        </div>
    </div>
</div>
